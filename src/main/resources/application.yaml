spring:
  application:
    name: routefinder
  security:
    user:
      name: admin
      password: admin
  datasource:
    url: jdbc:h2:mem:routefinder;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        default_schema: routefinder
  sql:
    init:
      mode: always
